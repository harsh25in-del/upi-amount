name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle (Bypasses Broken Wrapper)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper # Automatically tries the wrapper first, but fixes execution flags

    - name: Force Clean Build
      run: gradle clean

    - name: Compile App with System Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-ai-studio-app
        path: app/build/outputs/apk/debug/app-debug.apk
