name: Build & Release Android APK

on:
  push:
    branches:
      - main       # Change to 'master' if your default branch is master
    tags:
      - 'v*'       # Optional: triggers on version tags like v1.0.0
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create GitHub releases and upload assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK File
        id: apk_path
        run: |
          # Find the generated debug APK file path
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          echo "Found APK at: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk_path.outputs.apk }}
          retention-days: 14

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Automatic Build #${{ github.run_number }}"
          body: |
            ### Automated Android Build
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Download the debug APK below.
          draft: false
          prerelease: false
          files: ${{ steps.apk_path.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
